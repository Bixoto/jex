<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="One frozen checkpoint, two engines: deck31b (FP8, one temperature) scores 58.19 public index; Jex 1.0 scores 60.29 — a +2.10 difference that is all engineering.">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>
    <marker id="sc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6472"/>
    </marker>
    <style>
      .d{font-family:'Sofia Pro','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
      .m{font-family:'SFMono-Regular','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;}
    </style>
  </defs>

  <rect width="1200" height="440" rx="20" fill="url(#sc-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <text x="40" y="52" class="d" font-size="23" font-weight="800" fill="#F4F6FA">Same weights. +2.10 points.</text>
  <text x="40" y="78" class="d" font-size="13.5" fill="#8892A0">Two engines, one frozen checkpoint — everything between the two scores is engineering.</text>

  <!-- checkpoint -->
  <g transform="translate(390,98)">
    <rect x="0" y="0" width="420" height="80" rx="14" fill="#0C1015"/>
    <rect x="0.5" y="0.5" width="419" height="79" rx="13.5" fill="none" stroke="#34C9A2" stroke-opacity="0.45"/>
    <text x="20" y="26" class="m" font-size="11" letter-spacing="1.8" fill="#34C9A2">ONE FROZEN CHECKPOINT · NOTHING TRAINED</text>
    <text x="20" y="51" class="m" font-size="16" fill="#EDF0F5">google/gemma-4-31B-it</text>
    <text x="20" y="69" class="m" font-size="11.5" fill="#8892A0">@ 842da379… · bf16 · 31B · no head, no LoRA, no fine-tune</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#5B6472" stroke-width="1.6" marker-end="url(#sc-arrow)">
    <path d="M560 178 C 560 214, 275 200, 275 246"/>
    <path d="M640 178 C 640 214, 925 200, 925 246"/>
  </g>

  <!-- deck31b panel -->
  <g transform="translate(60,250)">
    <rect x="0" y="0" width="430" height="150" rx="14" fill="#0E1218"/>
    <rect x="0.5" y="0.5" width="429" height="149" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="0" y="0" width="430" height="4" rx="2" fill="#5B6472"/>
    <text x="22" y="38" class="d" font-size="18" font-weight="700" fill="#C7CFDA">deck31b</text>
    <text x="112" y="37" class="m" font-size="10.5" fill="#8892A0">frozen · FP8 e4m3</text>
    <text x="22" y="64" class="d" font-size="11.5" fill="#8892A0">stock checkpoint + FP8 linear layers (TorchAO)</text>
    <text x="22" y="81" class="d" font-size="11.5" fill="#8892A0">+ one calibration temperature (T = 3.4), letter readout</text>
    <text x="22" y="122" class="m" font-size="30" font-weight="700" fill="#C7CFDA">58.19</text>
    <text x="120" y="122" class="d" font-size="12" fill="#8892A0">public index</text>
    <text x="242" y="122" class="m" font-size="19" fill="#8892A0">59.03</text>
    <text x="286" y="122" class="d" font-size="12" fill="#8892A0">Full</text>
  </g>

  <!-- jex panel -->
  <g transform="translate(710,250)">
    <rect x="0" y="0" width="430" height="150" rx="14" fill="#0E1218"/>
    <rect x="0.5" y="0.5" width="429" height="149" rx="13.5" fill="none" stroke="#FF4200" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="430" height="4" rx="2" fill="#FF4200"/>
    <text x="22" y="38" class="d" font-size="18" font-weight="700" fill="#F4F6FA">Jex 1.0</text>
    <text x="98" y="37" class="m" font-size="10.5" fill="#FF7A45">frozen · bf16</text>
    <text x="22" y="64" class="d" font-size="11.5" fill="#8892A0">same checkpoint + the Jex engine</text>
    <text x="22" y="81" class="d" font-size="11.5" fill="#8892A0">(batch-invariant readout + 4 disclosed levers)</text>
    <text x="22" y="122" class="m" font-size="30" font-weight="700" fill="#FF4200">60.29</text>
    <text x="126" y="122" class="d" font-size="12" fill="#8892A0">public index</text>
  </g>

  <!-- delta pill -->
  <g transform="translate(505,270)">
    <rect x="0" y="0" width="190" height="86" rx="14" fill="#12070A"/>
    <rect x="0.5" y="0.5" width="189" height="85" rx="13.5" fill="none" stroke="#FF4200" stroke-opacity="0.55"/>
    <text x="95" y="42" text-anchor="middle" class="m" font-size="34" font-weight="700" fill="#FF4200">+2.10</text>
    <text x="95" y="66" text-anchor="middle" class="d" font-size="11.5" fill="#B7C0CD">public index</text>
  </g>

  <text x="40" y="428" class="d" font-size="12.5" fill="#8892A0">Both entries carry the same weights. The gap is the readout, the batching, the decision rules, and four disclosed post-processing levers — all public, all reversible.</text>
</svg>
